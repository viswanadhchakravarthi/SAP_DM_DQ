<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SAP DM Data Quality Review</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header>
    <div class="header-top">
      <h1>Data Quality Findings & Governance</h1>
      <div class="header-actions">
        <button id="runExplorerBtn" class="btn-run-explorer">▶ Run Explorer Agent</button>
        <button id="refreshBtn">Refresh</button>
        <button id="promoteBtn" class="btn-promote">Promote Approved Skills</button>
      </div>
    </div>

    <div id="jobBanner" class="job-banner hidden"></div>

    <div class="controls">
      <div class="control-group">
        <label for="runSelect">Run:</label>
        <select id="runSelect"></select>
      </div>

      <div class="control-group">
        <label for="statusFilter">Status:</label>
        <select id="statusFilter">
          <option value="">All Statuses</option>
          <option value="PENDING" selected>Pending</option>
          <option value="APPROVED">Approved</option>
          <option value="REJECTED">Rejected</option>
        </select>
      </div>

      <div class="control-group">
        <label for="scopeFilter">Rule Scope:</label>
        <select id="scopeFilter">
          <option value="">All Scopes</option>
          <option value="UNIVERSAL">Universal (Standard SAP)</option>
          <option value="INDUSTRY_SPECIFIC">Industry-Specific</option>
          <option value="CLIENT_SPECIFIC">Client-Specific</option>
        </select>
      </div>
    </div>

    <div class="category-tabs" id="categoryTabs">
      <button class="tab-btn active" data-category="" data-tooltip="Shows findings across all four data-quality pillars.">All Findings</button>
      <button class="tab-btn" data-category="ACTIVENESS" data-tooltip="Checks whether records are still in active use, or dormant/obsolete and worth reviewing for deactivation.">🕒 Activeness</button>
      <button class="tab-btn" data-category="DUPLICATE" data-tooltip="Flags records that may represent the same real-world vendor entered more than once.">👥 Duplicates</button>
      <button class="tab-btn" data-category="COMPLETENESS" data-tooltip="Flags missing or blank information that is expected to be filled in.">📋 Completeness</button>
      <button class="tab-btn" data-category="CORRECTNESS" data-tooltip="Flags values or relationships that look wrong, inconsistent, or unusual compared to expectations.">✅ Correctness</button>
      <button class="tab-btn" data-category="ANOMALIES" data-tooltip="Flags unusual values that stand out statistically from the rest of the data and may need a closer look.">⚡ Anomalies</button>
    </div>

    <div class="stats" id="statsBar"></div>
  </header>

  <main id="findingsContainer">
    <p class="empty-state">Loading findings...</p>
  </main>

  <div id="detailModal" class="modal hidden">
    <div class="modal-content">
      <button id="closeModal" class="close-btn">&times;</button>
      <h2>Finding Detail</h2>
      <div id="modalBody"></div>
    </div>
  </div>

  <div id="runExplorerModal" class="modal hidden">
    <div class="modal-content">
      <button id="closeRunExplorerModal" class="close-btn">&times;</button>
      <h2>Run Explorer Agent</h2>
      <div id="runExplorerModalBody"></div>
    </div>
  </div>

  <div id="sapTooltip" class="sap-tooltip hidden"></div>

  <script src="app.js"></script>
</body>
</html>
