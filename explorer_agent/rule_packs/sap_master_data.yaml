# Deterministic SAP master-data knowledge, executed by explorer_agent/sap_rules.py
# (Priority 1: domain rules) and explorer_agent/anomaly_rules.py (Priority 2:
# statistical and formatting anomalies).
#
# The rules are written against business CONCEPTS (KEY, DELETION_FLAG, COUNTRY,
# POSTAL_CODE, TAX_ID, AMOUNT, ...), never against column names. Which column
# plays which concept is the COLUMN MAPPING (explorer_agent/column_mapping.py):
#   * for SAP-standard layouts it comes from `standard_columns` below - free;
#   * for anything else one LLM call maps the table once per client+schema from
#     metadata only, and the result is saved under memory_store/clients/<client>/.
# Every rule is skipped when the concepts it needs are not mapped, and can be
# switched off per client in config.yaml (sap_rules.client_overrides).
#
# Rule ids: flag.<T>.<C>, dormant.<T>, mandatory.<T>.<C>, country.<T>.<C>,
# postal.<T>.<C>, tax.<T>.missing, tax.<T>.format, orphan.<T>.<PARENT>,
# propagation.<T>.<C>, anomaly.<check>.<T>.<C>, text.<check>.<T>.<C>.

version: 2

# ---------------------------------------------------------------------------
# COLUMN MAPPING for SAP-standard tables. A table is mapped from here only when
# EVERY uploaded column of it is listed (a Z-field or repurposed layout goes to
# the LLM instead, which sees the whole table). Attributes, same as the LLM's
# ColumnBinding (schemas.py):
#   concept          business meaning (see schemas.ColumnConcept)
#   part_of_key      the columns that together identify one row
#   references       TABLE.COLUMN this column must exist in (orphan checks)
#   related_column   COUNTRY for a POSTAL_CODE/TAX_ID, CURRENCY for an AMOUNT
#   required         mandatory; `required_group` = any one of the group is enough.
#                    Only SAP-standard mandatory fields - client requirements go
#                    in client_overrides.<client>.mandatory (KOINH is optional in SAP).
#                    For TAX_ID, required means "at least one tax field filled".
#   block_type       POSTING / PURCHASING / SALES / GENERAL, for BLOCK_FLAG
#   cascades         a master flag that standard SAP also sets on the org-level
#                    rows (central deletion flag XK06/XD06 -> LFB1/LFM1) - so a
#                    blank child flag is legacy data. Not MARA-LVORM: the client
#                    level already covers every plant.
#   dictionary_override  regex on the client's dictionary text -> attributes to
#                    change: a field documented differently follows the client.
# ---------------------------------------------------------------------------
standard_columns:
  LFA1:
    LIFNR: {concept: KEY, part_of_key: true}
    KTOKK: {concept: CODE, required: true}
    NAME1: {concept: LEGAL_NAME, required: true}
    NAME2: {concept: LEGAL_NAME}
    SORTL: {concept: SEARCH_TERM, required: true}
    STRAS: {concept: STREET}
    ORT01: {concept: CITY, required: true}
    PSTLZ: {concept: POSTAL_CODE, related_column: LAND1, required: true}
    LAND1: {concept: COUNTRY, required: true}
    SPRAS: {concept: CODE}
    TELF1: {concept: PHONE}
    SMTP_ADDR: {concept: EMAIL}
    STCD1: {concept: TAX_ID, related_column: LAND1, required: true}
    STCD2: {concept: TAX_ID, related_column: LAND1, required: true}
    STCD3: {concept: TAX_ID, related_column: LAND1, required: true}
    STCD4: {concept: TAX_ID, related_column: LAND1, required: true}
    STCD5: {concept: TAX_ID, related_column: LAND1, required: true}
    STCEG: {concept: TAX_ID, related_column: LAND1, required: true}
    LOEVM: {concept: DELETION_FLAG, cascades: true}
    ERDAT: {concept: CREATED_DATE}
    SPERM: {concept: BLOCK_FLAG, block_type: PURCHASING, cascades: true, dictionary_override: [{regex: posting, set: {block_type: POSTING}}]}
