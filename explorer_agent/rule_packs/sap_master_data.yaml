# ---------------------------------------------------------------------------
# Migration objects, for the DQ scorecard: which SAP tables make up each object.
# A non-SAP table joins the object of the SAP tables it is mapped to.
# ---------------------------------------------------------------------------
objects:
  Vendor: [LFA1, LFB1, LFBK, LFM1]
  Customer: [KNA1, KNB1, KNVV]
  Material: [MARA, MARC, MARD, MBEW, MVKE, MAKT]
  Service: [ASMD, ASMDT]
  Business Partner: [BUT000, BUT020, BUT0ID, BUT100, ADRC, CVI_VEND_LINK, CVI_CUST_LINK]

# ---------------------------------------------------------------------------
# ACTIVENESS
# ---------------------------------------------------------------------------
# Values meaning "set" for a flag whose mapping gives none.
flag_values: ["X"]

# Dormancy: CREATED_DATE older than this AND no row in any child table that
# extends the record to an organisational level (a table with an ORG_UNIT key
# column that references it). ERDAT is a creation date, so age alone says
# nothing; without transaction data (BSIK/BSAK/EKKO) this is the best evidence.
dormant_after_years: 3

# ---------------------------------------------------------------------------
# CORRECTNESS - country keys (ISO 3166-1 alpha-2). Postal and tax formats
# depend on a valid country, so an invalid one is reported and skipped there.
# ---------------------------------------------------------------------------
# Common legacy mistakes -> the ISO code, used only to suggest a correction.
country_aliases: {UK: GB, GER: DE, DEU: DE, USA: US, IND: IN, MEX: MX, SWI: CH, CHE: CH, UAE: AE, EL: GR}

iso_countries: >-
  AD AE AF AG AI AL AM AO AQ AR AS AT AU AW AX AZ BA BB BD BE BF BG BH BI BJ BL BM BN BO BQ
  BR BS BT BV BW BY BZ CA CC CD CF CG CH CI CK CL CM CN CO CR CU CV CW CX CY CZ DE DJ DK DM
  DO DZ EC EE EG EH ER ES ET FI FJ FK FM FO FR GA GB GD GE GF GG GH GI GL GM GN GP GQ GR GS
  GT GU GW GY HK HM HN HR HT HU ID IE IL IM IN IO IQ IR IS IT JE JM JO JP KE KG KH KI KM KN
  KP KR KW KY KZ LA LB LC LI LK LR LS LT LU LV LY MA MC MD ME MF MG MH MK ML MM MN MO MP MQ
  MR MS MT MU MV MW MX MY MZ NA NC NE NF NG NI NL NO NP NR NU NZ OM PA PE PF PG PH PK PL PM
  PN PR PS PT PW PY QA RE RO RS RU RW SA SB SC SD SE SG SH SI SJ SK SL SM SN SO SR SS ST SV
  SX SY SZ TC TD TF TG TH TJ TK TL TM TN TO TR TT TV TW TZ UA UG UM US UY UZ VA VC VE VG VI
  VN VU WF WS YE YT ZA ZM ZW

# ---------------------------------------------------------------------------
# CORRECTNESS - postal code format by country (full match, upper-cased,
# trimmed). Countries not listed are skipped, never failed.
# ---------------------------------------------------------------------------
postal:
  formats:
    DE: {regex: '\d{5}', example: '10115'}
    AT: {regex: '\d{4}', example: '1010'}
    CH: {regex: '\d{4}', example: '8001'}
    FR: {regex: '\d{5}', example: '75001'}
    IT: {regex: '\d{5}', example: '00118'}
    ES: {regex: '\d{5}', example: '28001'}
    PT: {regex: '\d{4}-\d{3}', example: '1000-001'}
    NL: {regex: '\d{4} ?[A-Z]{2}', example: '1012 AB'}
    BE: {regex: '\d{4}', example: '1000'}
    LU: {regex: '(L-)?\d{4}', example: '1111'}
    DK: {regex: '\d{4}', example: '1050'}
    "NO": {regex: '\d{4}', example: '0150'}
    FI: {regex: '\d{5}', example: '00100'}
    SE: {regex: '\d{3} ?\d{2}', example: '111 22'}
    CZ: {regex: '\d{3} ?\d{2}', example: '110 00'}
    SK: {regex: '\d{3} ?\d{2}', example: '811 01'}
    GR: {regex: '\d{3} ?\d{2}', example: '105 57'}
    PL: {regex: '\d{2}-\d{3}', example: '00-950'}
    HU: {regex: '\d{4}', example: '1051'}
    RO: {regex: '\d{6}', example: '010011'}
    IE: {regex: '[A-Z]\d[\dW] ?[A-Z\d]{4}', example: 'D02 X285'}
    GB: {regex: '[A-Z]{1,2}\d[A-Z\d]? ?\d[A-Z]{2}', example: 'EC1A 1BB'}
    US: {regex: '\d{5}(-\d{4})?', example: '10001'}
    CA: {regex: '[A-Z]\d[A-Z] ?\d[A-Z]\d', example: 'K1A 0B1'}
    MX: {regex: '\d{5}', example: '06600'}
    BR: {regex: '\d{5}-?\d{3}', example: '01310-100'}
    IN: {regex: '[1-9]\d{5}', example: '400001'}
    CN: {regex: '\d{6}', example: '100000'}
    JP: {regex: '\d{3}-?\d{4}', example: '100-0001'}
    KR: {regex: '\d{5}', example: '03051'}
    TR: {regex: '\d{5}', example: '34000'}
    VN: {regex: '\d{6}', example: '100000'}
    BD: {regex: '\d{4}', example: '1000'}
    AU: {regex: '\d{4}', example: '2000'}
    SG: {regex: '\d{6}', example: '018956'}
    RU: {regex: '\d{6}', example: '101000'}
    ZA: {regex: '\d{4}', example: '0001'}

# ---------------------------------------------------------------------------
# CORRECTNESS - tax numbers, evaluated across ALL TAX_ID columns of a row
# together. SAP keeps a country's number in different fields (India: GSTIN in
# STCD3; EU: VAT in STCEG; US: EIN in STCD2), and legacy data often has it in
# STCD1 anyway. So a row is missing a tax number only when none of its TAX_ID
# columns holds a real value, and each filled value must match one of its
# country's formats. A blank STCD1 is never an error on its own.
# ---------------------------------------------------------------------------
tax:
  # Where SAP expects the number, used only to word the finding.
  expected_field: {IN: STCD3 (GSTIN), US: STCD2 (EIN), EU: STCEG (VAT registration number)}
  placeholder_regex: '(TBD|TBA|N/?A|NONE|NULL|NIL|UNKNOWN|PENDING|TEST.*|DUMMY.*|X+|0+|9+|1234.*|-+|\.+|\?+)'
  eu_members: [AT, BE, BG, CY, CZ, DE, DK, EE, ES, FI, FR, GR, HR, HU, IE, IT, LT, LU, LV, MT, NL, PL, PT, RO, SE, SI, SK]
  # EU VAT registration numbers (VIES formats). Accepted in any tax field.
  eu_vat:
    AT: 'ATU\d{8}'
    BE: 'BE[01]\d{9}'
    BG: 'BG\d{9,10}'
    CY: 'CY\d{8}[A-Z]'
    CZ: 'CZ\d{8,10}'
    DE: 'DE\d{9}'
    DK: 'DK\d{8}'
    EE: 'EE\d{9}'
    ES: 'ES[A-Z0-9]\d{7}[A-Z0-9]'
    FI: 'FI\d{8}'
    FR: 'FR[A-HJ-NP-Z0-9]{2}\d{9}'
    GR: 'EL\d{9}'
    HR: 'HR\d{11}'
    HU: 'HU\d{8}'
    IE: 'IE(\d{7}[A-W][A-IW]?|\d[A-Z+*]\d{5}[A-W])'
    IT: 'IT\d{11}'
    LT: 'LT(\d{9}|\d{12})'
    LU: 'LU\d{8}'
    LV: 'LV\d{11}'
    MT: 'MT\d{8}'
    NL: 'NL\d{9}B\d{2}'
    PL: 'PL\d{10}'
    PT: 'PT\d{9}'
    RO: 'RO\d{2,10}'
    SE: 'SE\d{12}'
    SI: 'SI\d{8}'
    SK: 'SK\d{10}'
  # National tax numbers, by name. Spaces are removed before matching.
  national:
    DE: {Steuernummer: '\d{10,13}|\d{2,3}/\d{3,4}/\d{4,5}'}
    AT: {Steuernummer: '\d{9}'}
    GB: {UK VAT: 'GB(\d{9}|\d{12}|GD\d{3}|HA\d{3})', UTR: '\d{10}'}
    CH: {UID/MWST: 'CHE-?\d{3}\.?\d{3}\.?\d{3}(MWST|TVA|IVA)?'}
    FR: {SIREN/SIRET: '\d{9}|\d{14}'}
    IT: {Partita IVA: '\d{11}', Codice fiscale: '[A-Z]{6}\d{2}[A-Z]\d{2}[A-Z]\d{3}[A-Z]'}
    ES: {NIF/CIF: '[A-Z0-9]\d{7}[A-Z0-9]'}
    NL: {RSIN/BTW: '\d{9}(B\d{2})?'}
    PL: {NIP: '\d{10}|\d{3}-\d{3}-\d{2}-\d{2}'}
    PT: {NIF: '\d{9}'}
    SE: {Organisationsnummer: '\d{6}-?\d{4}'}
    IE: {TRN: '\d{7}[A-W][A-IW]?'}
    US: {EIN: '\d{2}-?\d{7}', SSN/ITIN: '\d{3}-?\d{2}-?\d{4}'}
    CA: {Business Number: '\d{9}(RT\d{4})?'}
    MX: {RFC: '[A-Z&Ñ]{3,4}\d{6}[A-Z0-9]{3}'}
    BR: {CNPJ: '\d{2}\.?\d{3}\.?\d{3}/?\d{4}-?\d{2}', CPF: '\d{3}\.?\d{3}\.?\d{3}-?\d{2}'}
    IN: {GSTIN: '\d{2}[A-Z]{5}\d{4}[A-Z][1-9A-Z]Z[0-9A-Z]', PAN: '[A-Z]{5}\d{4}[A-Z]'}
    CN: {Unified Social Credit Code: '[0-9A-Z]{18}'}
    JP: {Corporate Number: 'T?\d{13}'}
    KR: {Business Registration Number: '\d{3}-?\d{2}-?\d{5}'}
    TR: {VKN/TCKN: '\d{10,11}'}
    VN: {MST: '\d{10}(-\d{3})?'}
    BD: {BIN/TIN: '\d{9}(-\d{4})?|\d{12,13}'}
    AE: {TRN: '\d{15}'}
    AU: {ABN: '\d{11}'}
    SG: {UEN: '\d{8,9}[A-Z]|[TSR]\d{2}[A-Z]{2}\d{4}[A-Z]'}

# ---------------------------------------------------------------------------
# PRIORITY 2 - formatting anomalies on text concepts (anomaly_rules.py).
# ---------------------------------------------------------------------------
text:
  # Not allowed in a legal name. `& . , - / ' ( ) +` are normal ("Procter & Gamble").
  illegal_name_chars: '^*#$~|<>{}[]\=_!?%;@'
  # Left behind by a wrong UTF-8 / Latin-1 conversion (e.g. 'HochstÃ¤tt'), or the
  # replacement character for bytes that could not be decoded.
  mojibake_markers: ['Ã', 'Â', 'â€', 'Ð', 'Å', '\ufffd']
  html_entity_regex: '&(amp|lt|gt|quot|apos|nbsp|#\d+|#x[0-9a-fA-F]+);'
  placeholder_regex: '(X{2,}|TEST.*|DUMMY.*|N/?A|TBD|TBA|UNKNOWN|NONE|NULL|DO NOT USE.*|DELETE.*|\.+|-+|\?+|0+)'
  # A value written entirely in capitals is flagged only when at least this share of
  # the column is mixed case - an all-caps column is a convention, not an anomaly.
  mixed_case_share: 0.7
  # \w is Unicode-aware: internationalised domains ('bäckerei-brandes.de') are valid
  # (RFC 6531); empty labels ('food..com') are not.
  email_regex: '[\w.%+\-'']+@[\w\-]+(\.[\w\-]+)*\.[^\W\d_]{2,}'
  # A phone number: digits and + ( ) - / . spaces, optionally an extension.
  phone_regex: '\+?[\d\s()\-/.]{6,}((ext\.?|x)\s*\d{1,5})?'
  phone_min_digits: 6

