# Deterministic SAP master-data rules, executed by explorer_agent/sap_rules.py.
#
# These are known SAP standards, so they are written down once here instead of
# being re-invented by the planner LLM on every run. Every rule is skipped when a
# column or table it needs is not in the upload, and it can be switched off per
# client in config.yaml (sap_rules.client_overrides) - a standard field can mean
# something else at one company, and that belongs in configuration, not in code.
#
# Rule ids are built from the section and table, e.g. mandatory.LFA1.NAME1,
# flag.LFA1.LOEVM, tax.LFA1, postal.LFA1, country.LFA1, orphan.LFB1.LFA1,
# dormant.LFA1, propagation.<id>.

version: 1

# ---------------------------------------------------------------------------
# Business keys, used to label offending rows in the review app. The first
# column is the object key; the rest are organisational levels.
# ---------------------------------------------------------------------------
keys:
  LFA1: [LIFNR]
  LFB1: [LIFNR, BUKRS]
  LFBK: [LIFNR, BANKS, BANKL, BANKN]
  LFM1: [LIFNR, EKORG]
  KNA1: [KUNNR]
  KNB1: [KUNNR, BUKRS]
  KNVV: [KUNNR, VKORG]
  MARA: [MATNR]
  MARC: [MATNR, WERKS]
  MARD: [MATNR, WERKS, LGORT]
  MBEW: [MATNR, BWKEY]
  MVKE: [MATNR, VKORG, VTWEG]
  MAKT: [MATNR, SPRAS]
  ASMD: [ASNUM]
  ASMDT: [ASNUM, SPRAS]
  BUT000: [PARTNER]
  BUT020: [PARTNER, ADDRNUMBER]
  BUT0ID: [PARTNER, IDTYPE]
  BUT100: [PARTNER, RLTYP]
  ADRC: [ADDRNUMBER]
  CVI_VEND_LINK: [PARTNER, LIFNR]
  CVI_CUST_LINK: [PARTNER, KUNNR]

# ---------------------------------------------------------------------------
# ACTIVENESS - status flags. A set flag is a fact to act on during migration
# scoping (exclude, confirm, unblock), not a data error, hence the low severity.
# The client's data-dictionary description of the column is quoted in each row.
# ---------------------------------------------------------------------------
flags:
  - {table: LFA1, column: LOEVM, label: Deletion flag set}
  - {table: LFA1, column: SPERM, label: Central block set}
  - {table: LFB1, column: LOEVM, label: Deletion flag set (company code)}
  - {table: LFB1, column: SPERR, label: Posting block set (company code)}
  - {table: LFM1, column: LOEVM, label: Deletion flag set (purchasing org)}
  - {table: LFM1, column: SPERM, label: Purchasing block set (purchasing org)}
  - {table: KNA1, column: LOEVM, label: Deletion flag set}
  - {table: KNA1, column: SPERM, label: Central block set}
  - {table: KNB1, column: LOEVM, label: Deletion flag set (company code)}
  - {table: KNB1, column: SPERR, label: Posting block set (company code)}
  - {table: KNVV, column: LOEVM, label: Deletion flag set (sales area)}
  - {table: KNVV, column: SPERM, label: Block set (sales area)}
  - {table: MARA, column: LVORM, label: Deletion flag set}
  - {table: MARC, column: LVORM, label: Deletion flag set (plant)}
  - {table: MARD, column: LVORM, label: Deletion flag set (storage location)}
  - {table: MVKE, column: LVORM, label: Deletion flag set (sales org)}
  - {table: ASMD, column: LOEKZ, label: Deletion flag set}
  - {table: BUT000, column: XDELE, label: Deletion flag set}
  - {table: BUT000, column: XBLCK, label: Central block set}

flag_values: ["X"]

# ---------------------------------------------------------------------------
# ACTIVENESS - dormancy. ERDAT is a CREATION date, not a last-activity date, so
# age alone says nothing about use. A master record counts as dormant when it
# is older than `older_than_years` AND was never extended to any of its
# organisational-level tables. Without transaction data (BSIK/BSAK/EKKO) this
# is the strongest evidence available. Skipped when no child table is loaded.
# ---------------------------------------------------------------------------
dormancy:
  - {table: LFA1, date_column: ERDAT, children: [LFB1, LFM1], noun: vendor, older_than_years: 3}
  - {table: KNA1, date_column: ERDAT, children: [KNB1, KNVV], noun: customer, older_than_years: 3}

# ---------------------------------------------------------------------------
# COMPLETENESS - mandatory fields per table. Every default here is MANUAL_FIX:
# the value has to come from the business (a reconciliation account or a
# currency is not guessable). A client can agree on a default and make a field
# AUTO_FIXABLE in config.yaml -> sap_rules.client_overrides.<client>.auto_fix,
# and add client-specific mandatory fields there (client_overrides.<client>.mandatory).
# `any_of` lists alternatives: the row is complete when one of them is filled.
# ---------------------------------------------------------------------------
mandatory:
  LFA1:
    NAME1: {severity: HIGH, label: Vendor name}
    LAND1: {severity: HIGH, label: Country key}
    KTOKK: {severity: HIGH, label: Account group}
    ORT01: {severity: MEDIUM, label: City}
    PSTLZ: {severity: MEDIUM, label: Postal code}
    SORTL: {severity: LOW, label: Search term}
  LFB1:
    BUKRS: {severity: HIGH, label: Company code}
    AKONT: {severity: HIGH, label: Reconciliation account}
    ZTERM: {severity: MEDIUM, label: Payment terms}
  LFBK:
    BANKS: {severity: HIGH, label: Bank country}
    BANKL: {severity: HIGH, label: Bank key}
    BANKN: {severity: HIGH, label: Bank account number or IBAN, any_of: [BANKN, IBAN]}
    # KOINH (account holder) is optional in standard SAP - it defaults to the vendor
    # name. Clients that require it add it via client_overrides.<client>.mandatory.
  LFM1:
    EKORG: {severity: HIGH, label: Purchasing organization}
    WAERS: {severity: HIGH, label: Order currency}
  KNA1:
    NAME1: {severity: HIGH, label: Customer name}
    LAND1: {severity: HIGH, label: Country key}
    KTOKD: {severity: HIGH, label: Account group}
    ORT01: {severity: MEDIUM, label: City}
    PSTLZ: {severity: MEDIUM, label: Postal code}
    SORTL: {severity: LOW, label: Search term}
  KNB1:
    BUKRS: {severity: HIGH, label: Company code}
    AKONT: {severity: HIGH, label: Reconciliation account}
    ZTERM: {severity: MEDIUM, label: Payment terms}
  KNVV:
    VKORG: {severity: HIGH, label: Sales organization}
    WAERS: {severity: HIGH, label: Currency}
  MARA:
    MTART: {severity: HIGH, label: Material type}
    MEINS: {severity: HIGH, label: Base unit of measure}
    MATKL: {severity: MEDIUM, label: Material group}
  ASMD:
    MEINS: {severity: HIGH, label: Base unit of measure}
    MATKL: {severity: MEDIUM, label: Service group}
  ADRC:
    COUNTRY: {severity: HIGH, label: Country}
    POST_CODE1: {severity: MEDIUM, label: Postal code}

# ---------------------------------------------------------------------------
# CORRECTNESS - country keys (ISO 3166-1 alpha-2). Postal and tax formats depend
# on a valid country, so an invalid one is reported here and skipped there.
# ---------------------------------------------------------------------------
country_columns:
  LFA1: LAND1
  KNA1: LAND1
  LFBK: BANKS
  ADRC: COUNTRY
  BUT0ID: COUNTRY

# Common legacy mistakes -> the ISO code, used only to suggest a correction.
country_aliases: {UK: GB, GER: DE, DEU: DE, USA: US, IND: IN, MEX: MX, SWI: CH, CHE: CH, UAE: AE, EL: GR}

iso_countries: >-
  AD AE AF AG AI AL AM AO AQ AR AS AT AU AW AX AZ BA BB BD BE BF BG BH BI BJ BL BM BN BO BQ
  BR BS BT BV BW BY BZ CA CC CD CF CG CH CI CK CL CM CN CO CR CU CV CW CX CY CZ DE DJ DK DM
  DO DZ EC EE EG EH ER ES ET FI FJ FK FM FO FR GA GB GD GE GF GG GH GI GL GM GN GP GQ GR GS
  GT GU GW GY HK HM HN HR HT HU ID IE IL IM IN IO IQ IR IS IT JE JM JO JP KE KG KH KI KM KN
  KP KR KW KY KZ LA LB LC LI LK LR LS LT LU LV LY MA MC MD ME MF MG MH MK ML MM MN MO MP MQ
  MR MS MT MU MV MW MX MY MZ NA NC NE NF NG NI NL NO NP NR NU NZ OM PA PE PF PG PH PK PL PM
  PN PR PS PT PW PY QA RE RO RS RU RW SA SB SC SD SE SG SH SI SJ SK SL SM SN SO SR SS ST SV
  SX SY SZ TC TD TF TG TH TJ TK TL TM TN TO TR TT TV TW TZ UA UG UM US UY UZ VA VC VE VG VI
  VN VU WF WS YE YT ZA ZM ZW

# ---------------------------------------------------------------------------
# CORRECTNESS - postal code format by country (full match, upper-cased, trimmed).
# Countries not listed are skipped, never failed. Blank codes are left to the
# mandatory-field rule.
# ---------------------------------------------------------------------------
postal:
  tables:
    LFA1: {column: PSTLZ, country: LAND1}
    KNA1: {column: PSTLZ, country: LAND1}
    ADRC: {column: POST_CODE1, country: COUNTRY}
  formats:
    DE: {regex: '\d{5}', example: '10115'}
    AT: {regex: '\d{4}', example: '1010'}
    CH: {regex: '\d{4}', example: '8001'}
    FR: {regex: '\d{5}', example: '75001'}
    IT: {regex: '\d{5}', example: '00118'}
    ES: {regex: '\d{5}', example: '28001'}
    PT: {regex: '\d{4}-\d{3}', example: '1000-001'}
    NL: {regex: '\d{4} ?[A-Z]{2}', example: '1012 AB'}
    BE: {regex: '\d{4}', example: '1000'}
    LU: {regex: '(L-)?\d{4}', example: '1111'}
    DK: {regex: '\d{4}', example: '1050'}
    "NO": {regex: '\d{4}', example: '0150'}
    FI: {regex: '\d{5}', example: '00100'}
    SE: {regex: '\d{3} ?\d{2}', example: '111 22'}
    CZ: {regex: '\d{3} ?\d{2}', example: '110 00'}
    SK: {regex: '\d{3} ?\d{2}', example: '811 01'}
    GR: {regex: '\d{3} ?\d{2}', example: '105 57'}
    PL: {regex: '\d{2}-\d{3}', example: '00-950'}
    HU: {regex: '\d{4}', example: '1051'}
    RO: {regex: '\d{6}', example: '010011'}
    IE: {regex: '[A-Z]\d[\dW] ?[A-Z\d]{4}', example: 'D02 X285'}
    GB: {regex: '[A-Z]{1,2}\d[A-Z\d]? ?\d[A-Z]{2}', example: 'EC1A 1BB'}
    US: {regex: '\d{5}(-\d{4})?', example: '10001'}
    CA: {regex: '[A-Z]\d[A-Z] ?\d[A-Z]\d', example: 'K1A 0B1'}
    MX: {regex: '\d{5}', example: '06600'}
    BR: {regex: '\d{5}-?\d{3}', example: '01310-100'}
    IN: {regex: '[1-9]\d{5}', example: '400001'}
    CN: {regex: '\d{6}', example: '100000'}
    JP: {regex: '\d{3}-?\d{4}', example: '100-0001'}
    KR: {regex: '\d{5}', example: '03051'}
    TR: {regex: '\d{5}', example: '34000'}
    VN: {regex: '\d{6}', example: '100000'}
    BD: {regex: '\d{4}', example: '1000'}
    AU: {regex: '\d{4}', example: '2000'}
    SG: {regex: '\d{6}', example: '018956'}
    RU: {regex: '\d{6}', example: '101000'}
    ZA: {regex: '\d{4}', example: '0001'}

# ---------------------------------------------------------------------------
# CORRECTNESS - tax numbers, evaluated across ALL tax fields of a row together.
# SAP keeps a country's number in different fields (India: GSTIN in STCD3; EU:
# VAT in STCEG; US: EIN in STCD2), and legacy data often has it in STCD1 anyway.
# So a row is:
#   * missing     - when none of its tax fields holds a real value
#   * invalid     - per filled value that matches none of its country's formats
#                   (countries without formats here are only checked for presence)
# A blank STCD1 is never an error on its own.
# ---------------------------------------------------------------------------
tax:
  tables:
    LFA1: {country: LAND1, noun: vendor}
    KNA1: {country: LAND1, noun: customer}
  fields: [STCD1, STCD2, STCD3, STCD4, STCD5, STCEG]
  # Where SAP expects the number, used only to word the finding.
  expected_field: {IN: STCD3 (GSTIN), US: STCD2 (EIN), EU: STCEG (VAT registration number)}
  placeholder_regex: '(TBD|TBA|N/?A|NONE|NULL|NIL|UNKNOWN|PENDING|TEST.*|DUMMY.*|X+|0+|9+|1234.*|-+|\.+|\?+)'
  eu_members: [AT, BE, BG, CY, CZ, DE, DK, EE, ES, FI, FR, GR, HR, HU, IE, IT, LT, LU, LV, MT, NL, PL, PT, RO, SE, SI, SK]
  # EU VAT registration numbers (VIES formats). Accepted in any tax field.
  eu_vat:
    AT: 'ATU\d{8}'
    BE: 'BE[01]\d{9}'
    BG: 'BG\d{9,10}'
    CY: 'CY\d{8}[A-Z]'
    CZ: 'CZ\d{8,10}'
    DE: 'DE\d{9}'
    DK: 'DK\d{8}'
    EE: 'EE\d{9}'
    ES: 'ES[A-Z0-9]\d{7}[A-Z0-9]'
    FI: 'FI\d{8}'
    FR: 'FR[A-HJ-NP-Z0-9]{2}\d{9}'
    GR: 'EL\d{9}'
    HR: 'HR\d{11}'
    HU: 'HU\d{8}'
    IE: 'IE(\d{7}[A-W][A-IW]?|\d[A-Z+*]\d{5}[A-W])'
    IT: 'IT\d{11}'
    LT: 'LT(\d{9}|\d{12})'
    LU: 'LU\d{8}'
    LV: 'LV\d{11}'
    MT: 'MT\d{8}'
    NL: 'NL\d{9}B\d{2}'
    PL: 'PL\d{10}'
    PT: 'PT\d{9}'
    RO: 'RO\d{2,10}'
    SE: 'SE\d{12}'
    SI: 'SI\d{8}'
    SK: 'SK\d{10}'
  # National tax numbers, by name. Spaces are removed before matching.
  national:
    DE: {Steuernummer: '\d{10,13}|\d{2,3}/\d{3,4}/\d{4,5}'}
    AT: {Steuernummer: '\d{9}'}
    GB: {UK VAT: 'GB(\d{9}|\d{12}|GD\d{3}|HA\d{3})', UTR: '\d{10}'}
    CH: {UID/MWST: 'CHE-?\d{3}\.?\d{3}\.?\d{3}(MWST|TVA|IVA)?'}
    FR: {SIREN/SIRET: '\d{9}|\d{14}'}
    IT: {Partita IVA: '\d{11}', Codice fiscale: '[A-Z]{6}\d{2}[A-Z]\d{2}[A-Z]\d{3}[A-Z]'}
    ES: {NIF/CIF: '[A-Z0-9]\d{7}[A-Z0-9]'}
    NL: {RSIN/BTW: '\d{9}(B\d{2})?'}
    PL: {NIP: '\d{10}|\d{3}-\d{3}-\d{2}-\d{2}'}
    PT: {NIF: '\d{9}'}
    SE: {Organisationsnummer: '\d{6}-?\d{4}'}
    IE: {TRN: '\d{7}[A-W][A-IW]?'}
    US: {EIN: '\d{2}-?\d{7}', SSN/ITIN: '\d{3}-?\d{2}-?\d{4}'}
    CA: {Business Number: '\d{9}(RT\d{4})?'}
    MX: {RFC: '[A-Z&Ñ]{3,4}\d{6}[A-Z0-9]{3}'}
    BR: {CNPJ: '\d{2}\.?\d{3}\.?\d{3}/?\d{4}-?\d{2}', CPF: '\d{3}\.?\d{3}\.?\d{3}-?\d{2}'}
    IN: {GSTIN: '\d{2}[A-Z]{5}\d{4}[A-Z][1-9A-Z]Z[0-9A-Z]', PAN: '[A-Z]{5}\d{4}[A-Z]'}
    CN: {Unified Social Credit Code: '[0-9A-Z]{18}'}
    JP: {Corporate Number: 'T?\d{13}'}
    KR: {Business Registration Number: '\d{3}-?\d{2}-?\d{5}'}
    TR: {VKN/TCKN: '\d{10,11}'}
    VN: {MST: '\d{10}(-\d{3})?'}
    BD: {BIN/TIN: '\d{9}(-\d{4})?|\d{12,13}'}
    AE: {TRN: '\d{15}'}
    AU: {ABN: '\d{11}'}
    SG: {UEN: '\d{8,9}[A-Z]|[TSR]\d{2}[A-Z]{2}\d{4}[A-Z]'}

# ---------------------------------------------------------------------------
# CORRECTNESS / RELATIONSHIP_INTEGRITY - orphan child records: a child row whose
# key does not exist in its parent table. Skipped when the parent is not loaded
# (e.g. a --tables LFB1 run), since every row would look orphaned.
# `join` maps child column -> parent column.
# ---------------------------------------------------------------------------
relationships:
  - {child: LFB1, parent: LFA1, join: {LIFNR: LIFNR}}
  - {child: LFBK, parent: LFA1, join: {LIFNR: LIFNR}}
  - {child: LFM1, parent: LFA1, join: {LIFNR: LIFNR}}
  - {child: KNB1, parent: KNA1, join: {KUNNR: KUNNR}}
  - {child: KNVV, parent: KNA1, join: {KUNNR: KUNNR}}
  - {child: MAKT, parent: MARA, join: {MATNR: MATNR}}
  - {child: MARC, parent: MARA, join: {MATNR: MATNR}}
  - {child: MARD, parent: MARC, join: {MATNR: MATNR, WERKS: WERKS}}
  - {child: MBEW, parent: MARA, join: {MATNR: MATNR}}
  - {child: MVKE, parent: MARA, join: {MATNR: MATNR}}
  - {child: ASMDT, parent: ASMD, join: {ASNUM: ASNUM}}
  - {child: BUT020, parent: BUT000, join: {PARTNER: PARTNER}}
  - {child: BUT020, parent: ADRC, join: {ADDRNUMBER: ADDRNUMBER}}
  - {child: BUT0ID, parent: BUT000, join: {PARTNER: PARTNER}}
  - {child: BUT100, parent: BUT000, join: {PARTNER: PARTNER}}
  - {child: CVI_VEND_LINK, parent: BUT000, join: {PARTNER: PARTNER}}
  - {child: CVI_VEND_LINK, parent: LFA1, join: {LIFNR: LIFNR}}
  - {child: CVI_CUST_LINK, parent: BUT000, join: {PARTNER: PARTNER}}
  - {child: CVI_CUST_LINK, parent: KNA1, join: {KUNNR: KUNNR}}

# ---------------------------------------------------------------------------
# CORRECTNESS / RELATIONSHIP_INTEGRITY - a flag set on the master record but not
# on its organisational-level rows (e.g. vendor deleted in LFA1, company code in
# LFB1 still active). `child_flag: null` means the child row existing at all is
# the inconsistency.
#
# Only pairs where standard SAP sets both levels together belong here: the
# central deletion flag (XK06/XD06) marks LFB1/LFM1 (KNB1/KNVV) as well, so a
# blank org-level flag under a deleted master comes from legacy data. Not
# listed on purpose: MARA-LVORM (the client-level flag already covers every
# plant) and bank details on a deleted vendor (deletion never removes them).
#
# `guard` protects against a field meaning something else at this client: the
# rule runs only when the client's data dictionary describes the column the
# way the regex says. `if_undocumented` decides when the dictionary has no entry.
# Standard SAP: LFA1-SPERM is the central PURCHASING block (-> LFM1-SPERM) and
# LFA1-SPERR the central POSTING block (-> LFB1-SPERR); some legacy extracts
# document SPERM as a posting block, and then the LFB1 rule applies instead.
# ---------------------------------------------------------------------------
propagation:
  - {id: lfa1_deleted_lfb1, parent: LFA1, parent_flag: LOEVM, child: LFB1, child_flag: LOEVM, join: {LIFNR: LIFNR},
     text: "vendor is flagged for deletion in LFA1 but its company code data is still active"}
  - {id: lfa1_deleted_lfm1, parent: LFA1, parent_flag: LOEVM, child: LFM1, child_flag: LOEVM, join: {LIFNR: LIFNR},
     text: "vendor is flagged for deletion in LFA1 but its purchasing data is still active"}
  - {id: lfa1_posting_block_lfb1, parent: LFA1, parent_flag: SPERM, child: LFB1, child_flag: SPERR, join: {LIFNR: LIFNR},
     guard: {column: SPERM, regex: 'posting', if_undocumented: false},
     text: "vendor has a central posting block in LFA1 but the company code posting block is not set"}
  - {id: lfa1_posting_block_lfb1_sperr, parent: LFA1, parent_flag: SPERR, child: LFB1, child_flag: SPERR, join: {LIFNR: LIFNR},
     text: "vendor has a central posting block in LFA1 but the company code posting block is not set"}
  - {id: lfa1_purchasing_block_lfm1, parent: LFA1, parent_flag: SPERM, child: LFM1, child_flag: SPERM, join: {LIFNR: LIFNR},
     guard: {column: SPERM, regex: 'purchas', if_undocumented: true},
     text: "vendor has a central purchasing block in LFA1 but the purchasing organization is not blocked"}
  - {id: kna1_deleted_knb1, parent: KNA1, parent_flag: LOEVM, child: KNB1, child_flag: LOEVM, join: {KUNNR: KUNNR},
     text: "customer is flagged for deletion in KNA1 but its company code data is still active"}
  - {id: kna1_deleted_knvv, parent: KNA1, parent_flag: LOEVM, child: KNVV, child_flag: LOEVM, join: {KUNNR: KUNNR},
     text: "customer is flagged for deletion in KNA1 but its sales area data is still active"}
  - {id: kna1_posting_block_knb1, parent: KNA1, parent_flag: SPERM, child: KNB1, child_flag: SPERR, join: {KUNNR: KUNNR},
     guard: {column: SPERM, regex: 'posting', if_undocumented: false},
     text: "customer has a central posting block in KNA1 but the company code posting block is not set"}
