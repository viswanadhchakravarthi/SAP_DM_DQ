# SAP_DM_DQ configuration.
#
# Non-secret, shareable settings live here and are committed to version
# control. Secrets (API keys, tokens) and machine-specific values (like a
# local GGUF model path) stay in a local, gitignored .env file instead -
# see README.md.
#
# Every value below can also be overridden per-machine via an environment
# variable without editing this file - see explorer_agent/config.py for the
# exact variable name behind each setting.

# Where secrets (API keys, tokens) are read from. Kept outside the repository so
# they can't be committed. "~" is your home directory: C:\Users\<you> on Windows,
# /home/<you> on Linux. %VAR% / $VAR are expanded. Overridable with
# EXPLORER_ENV_FILE. A missing file falls back to <project>/.env with a warning.
env_file: ~/.env

llm:
  # The one LLM backend: "google" (Gemini API) or "local" (GGUF model via
  # llama-cpp-python). There is no fallback chain: if the model fails, the
  # table is skipped (exit code 1) and the run reports it.
  # Overridable with EXPLORER_LLM_PROVIDER, or --llm-provider on the CLI.
  # The local model is only loaded into memory when provider is "local".
  provider: google

  # Retries after the first attempt (with backoff, done by the provider SDK)
  # for transient errors (429, 5xx, timeouts) before the call is given up.
  max_retries: 2 # EXPLORER_LLM_MAX_RETRIES
  timeout_seconds: 120 # EXPLORER_LLM_TIMEOUT
  # Extra attempts on the SAME model when it returns invalid/missing structured
  # output (invalid JSON, skipped tool call) - often random, so worth a retry.
  structured_output_retries: 1 # EXPLORER_LLM_STRUCTURED_OUTPUT_RETRIES

  gemini:
    model: gemini-3.6-flash
    # null = model default. gemini-3.6-flash uses fixed sampling and ignores
    # (and warns about) any explicit temperature.
    temperature: null

  local:
    # Path to a local GGUF model file ("~" and %VAR% are expanded). Only used
    # when provider is "local". Machine-specific: EXPLORER_LOCAL_LLM_MODEL_PATH
    # overrides it per machine without editing this file.
    model_path: ~/.cache/kagglehub/models/qwen-lm/qwen2.5-coder/gguf/3b-instruct/1/qwen2.5-coder-3b-instruct-q4_k_m.gguf
    n_ctx: 4096

data:
  # Tables are NOT listed here: every CSV in a run's data folder except the
  # data dictionary is a table, named after its file (LFA1.csv -> LFA1).
  # Default dictionary file name for CLI runs (--dictionary-file). EXPLORER_DICTIONARY_FILE
  dictionary_file: Data_Dictionary.csv

  # Files uploaded on the review app's first page, one folder per client:
  # client_data/<client_id>/ (the tables, the dictionary and workspace.json).
  # Raw client data - gitignored. EXPLORER_CLIENT_DATA_DIR
  client_data_dir: client_data
  max_upload_mb: 200 # per file; EXPLORER_MAX_UPLOAD_MB

  # One-line business meaning per SAP table, shown in the review app's
  # hover tooltips (the dictionary CSV covers columns). Tables not listed here
  # simply get no table-level description.
  table_descriptions:
    LFA1: "Vendor Master (General Data) - one row per vendor, client-independent (name, address, tax numbers)."
    LFB1: "Vendor Master (Company Code Data) - a vendor's financial settings within one company code (payment terms, reconciliation account, blocks)."
    LFBK: "Vendor Master (Bank Details) - one or more bank accounts registered for a vendor."
    LFM1: "Vendor Master (Purchasing Organization Data) - a vendor's purchasing terms within one purchasing organization."

duplicates:
  # Deterministic duplicate MATCHING (explorer_agent/duplicate_detector.py): runs
  # locally with zero LLM calls, and the planner no longer proposes DUPLICATE checks.
  # WHICH columns it matches on is drafted by the LLM once per client+schema
  # (explorer_agent/duplicate_rule_planner.py) and then reused from memory.
  # EXPLORER_DUPLICATES_ENABLED
  enabled: true
  # Minimum fuzzy name similarity (0-100) for a name-based match. Fuzzy name
  # matches always also need a matching location field, and names whose
  # numbers differ ("Plant 1" vs "Plant 2") never fuzzy-match.
  fuzzy_name_threshold: 85 # EXPLORER_DUPLICATE_FUZZY_THRESHOLD
  # An identifier value shared by more records than this is treated as a
  # placeholder/default (e.g. a dummy tax ID), not as proof of duplication.
  max_identifier_share: 5 # EXPLORER_DUPLICATE_MAX_IDENTIFIER_SHARE
  # Fuzzy comparisons run inside location blocks (same city/postal code);
  # blocks larger than this are skipped to bound runtime on big tables.
  max_block_size: 500 # EXPLORER_DUPLICATE_MAX_BLOCK
  max_groups: 500 # EXPLORER_DUPLICATE_MAX_GROUPS
  # Don't show a group again when a reviewer already decided every record in it
  # (each one DUPLICATE or UNIQUE against all its current partners). A new member
  # or a changed record brings it back. Decisions stay in
  # memory_store/clients/<client>/duplicate_decisions.json. EXPLORER_DUPLICATE_HIDE_DECIDED
  hide_decided_groups: true

  rules:
    # How the matching rules for a table are produced (explorer_agent/duplicate_rules.py):
    # the LLM drafts them once from the client's data dictionary and sanitized column
    # statistics, they are saved under memory_store/clients/<client_id>/duplicate_rules.json,
    # and every later run for that client reuses them with no LLM call. A table whose
    # column set changed is re-drafted on its own; the others stay free.

    # Masked example values per column included in the drafting prompt (0 = none).
    # Only the last two characters of a value are visible - see profiler_primitives.mask_value.
    sample_values: 3 # EXPLORER_DUPLICATE_RULE_SAMPLES

    # Safety net on the drafted rules: a column the LLM called an identifier on its
    # own is rejected when fewer than this share of its filled values are distinct.
    # One value then covers many records, so it cannot identify one - this catches a
    # composite identifier (bank country + key + account) whose parts were not put in
    # a shared identifier_group. Purely statistical; it never invents a rule.
    min_identifier_distinct: 0.5 # EXPLORER_DUPLICATE_RULE_MIN_DISTINCT

    # Reuse rules the LLM marked UNIVERSAL / INDUSTRY_SPECIFIC at OTHER clients
    # (exact same column set only). Off by default: the same (table, column) pair
    # can mean different things at different companies, because standard fields get
    # repurposed and custom fields mean whatever their owner decided.
    reuse_across_clients: false # EXPLORER_DUPLICATE_RULES_SHARE

  # Rules are drafted per table as described above - no per-table setup needed.
  # Only add a table here to pin its rules by hand and skip both the LLM and memory, e.g.:
  #   tables:
  #     LFBK:
  #       key: LIFNR            # business key column(s)
  #       key_unique: false     # true = a repeated key is itself a duplicate
  #       name: KOINH           # name column (used only together with location)
  #       identifiers: [IBAN, [BANKS, BANKL, BANKN]]   # nested list = composite identifier
  #       location: []          # corroborating fields for name matches
  #       display: [KOINH, BANKS, BANKL, BANKN, IBAN]  # columns shown in the review app
  tables: {}

scorecard:
  # Composite DQ Index per table, migration object and run (explorer_agent/scorecard.py),
  # computed during the run from the deterministic engines only (reproducible; LLM
  # checks are left out). Weighted average of the pillars that have a score.
  # Activeness is shown but weighted 0: a deleted or dormant record is a migration-scope
  # fact, not bad data. Set it above 0 to include it.
  weights: {completeness: 0.35, correctness: 0.35, uniqueness: 0.30, activeness: 0.0}
  # Status bands shown on the dashboard: Good from `good`, Fair from `fair`, else Poor.
  bands: {good: 0.95, fair: 0.85}
  # RECORD READINESS (the dashboard's headline): share of in-scope records with no open
  # defect - loadable as they are. Deleted/dormant records are out of scope. Its bands:
  readiness_bands: {good: 0.95, fair: 0.80}
  # Not-ready records kept per table with their reasons (the cleansing worklist).
  max_worklist: 5000 # EXPLORER_READINESS_MAX_WORKLIST

handoff:
  # Priority 4 - the pipeline around this agent (explorer_agent/contracts.py):
  #   Extract -> structural profile -> Mapping Agent -> field/value mapping -> DQ rules -> Cleansing
  # OUT: every run writes the structural profile (types, lengths, value shapes/regexes,
  # distinct values of code columns) for the Mapping / Value Mapping Agent to
  # <dir>/<client_id>/<run_id>/structural_profile.json (+ structural_profile.latest.json).
  # It contains client values (code lists), so it is gitignored like client_data/.
  dir: handoff # EXPLORER_HANDOFF_DIR
  # A code column with more distinct values than this lists none of them.
  max_domain_values: 200 # EXPLORER_HANDOFF_MAX_DOMAIN
  # IN: the Mapping Agent's field/value mapping, picked up from the client's data
  # folder under this name (or --mapping-file). When present it decides what each
  # source column means for the DQ rules. EXPLORER_HANDOFF_MAPPING_FILE
  mapping_file: field_mapping.json
  # The Mapping Agent sends ALL candidates with a 0-100 confidence_score (tiers: 90-100
  # HIGH, 70-89 MEDIUM, 40-69 LOW, 0-39 VERY_LOW - scoping document section 14); this
  # side decides what the DQ rules use. APPROVED always counts, REJECTED never, PROPOSED
  # from this score (default: HIGH only). EXPLORER_HANDOFF_MIN_CONFIDENCE
  min_confidence: 90
  # IN: allowed SAP values per target field (check tables) from the Metadata Repository,
  # picked up from the client's data folder under this name (or --target-domains-file).
  # A value outside its domain is an INVALID_CODE finding, and the domain replaces the
  # statistical rare-code check for that column. EXPLORER_HANDOFF_TARGET_DOMAINS_FILE
  target_domains_file: target_domains.json

survivorship:
  # Record quality score (0-100) for every member of a duplicate group, and a
  # recommended survivor ("Unique") the others merge into (explorer_agent/survivorship.py).
  # It is only a pre-selection in the review app: nothing is decided until a
  # reviewer clicks Accept. EXPLORER_SURVIVORSHIP_ENABLED
  enabled: true
  # Components, each 0..1 (a component that cannot be computed for a table - no
  # creation date, no org-level tables loaded - is left out and the rest re-weighted):
  #   completeness  share of the record's important mapped fields (required, tax,
  #                 contact, address, name) that are filled AND not flagged by a rule
  #   active        1 = no flag, 0.5 = blocked, 0 = marked for deletion
  #   usage         share of org-level child tables (company code, purchasing org...)
  #                 the record is extended to - the record the business uses survives
  #   recency       creation date ranked within the group (newest 1, oldest 0)
  weights: {completeness: 0.4, active: 0.25, usage: 0.2, recency: 0.15}
  # Only groups with a strong match get a pre-selected survivor; SIMILAR groups hold
  # look-alikes (same trading name, different company), so the reviewer confirms
  # the duplicate first. EXPLORER_SURVIVORSHIP_MATCH_TYPES
  recommend_for: [EXACT, PROBABLE]

sap_rules:
  # Deterministic SAP domain rules (explorer_agent/sap_rules.py): deletion flags,
  # blocks, dormancy, mandatory fields, country-aware tax and postal-code formats,
  # orphan child records and flags not carried from a master to its org-level rows.
  # They run before the planner with zero LLM calls, and the planner is told which
  # checks they already cover so it does not re-invent them. They are written
  # against the column MAPPING (explorer_agent/column_mapping.py), not column names:
  # SAP-standard tables are mapped from the pack for free, any other layout by one
  # LLM call per client+schema (saved under memory_store/clients/<client>/
  # column_mappings.json - edit that file to correct a mapping). EXPLORER_SAP_RULES_ENABLED
  enabled: true
  # The rules themselves are data, not code - edit the pack to add a table, field,
  # country format or relationship. EXPLORER_SAP_RULES_PACK
  pack_file: explorer_agent/rule_packs/sap_master_data.yaml
  # Offending rows stored per finding (all of them go to the local store only,
  # never to an LLM). EXPLORER_SAP_RULES_MAX_ROWS
  max_rows_per_finding: 1000
  # Rule ids to switch off everywhere (comma-separated in EXPLORER_SAP_RULES_DISABLED).
  disabled_rules: []
  # Per client: switch rules off (an id or a prefix such as "flag" or "tax.LFA1"),
  # require extra fields, or make a mandatory field AUTO_FIXABLE with an agreed
  # default. A standard SAP field can mean something else at one client - this is
  # where that is recorded, not in code. Example:
  #   client_overrides:
  #     acme-retail:
  #       disabled_rules: [propagation.KNVV.LOEVM, text.casing]
  #       mandatory:
  #         LFBK:
  #           KOINH: {severity: MEDIUM, label: Account holder}
  #       auto_fix:
  #         LFB1.ZTERM: "0001"
  client_overrides: {}

anomalies:
  # Statistical and formatting anomalies (explorer_agent/anomaly_rules.py), run with
  # the SAP rules on every table, zero LLM calls. They read the column mapping, so
  # they work on any schema: amounts/quantities, codes, currencies, names, e-mail
  # and phone columns are found by meaning, not by name. EXPLORER_ANOMALIES_ENABLED
  enabled: true
  # Outliers on AMOUNT/QUANTITY columns: an IQR fence on log10 of the positive values
  # (business amounts are skewed - a linear 1.5 x IQR flags every large-but-normal
  # order), per currency when the amount has one. The fence is at least
  # outlier_min_fence_decades wide (1.0 = 10x beyond the quartile).
  outlier_iqr_multiplier: 3.0 # EXPLORER_ANOMALY_IQR_MULTIPLIER
  outlier_min_fence_decades: 1.0 # EXPLORER_ANOMALY_MIN_FENCE_DECADES
  outlier_min_samples: 20 # per currency group; EXPLORER_ANOMALY_MIN_SAMPLES
  # Also flag values far BELOW the range. Off: small weights and stock levels are
  # normal, while the defects seen are typing errors on the high side. EXPLORER_ANOMALY_FLAG_LOW
  outlier_flag_low: false
  # Rare codes in CODE columns (payment terms, incoterms, account groups, ...): a code
  # used at most rare_code_max_count times (and <= rare_code_max_share of rows) in a
  # column of <= rare_code_max_distinct codes whose typical code covers at least
  # rare_code_min_typical_count rows. Codes cannot be validated without the
  # customizing tables, so rarity is the evidence.
  rare_code_max_count: 2 # EXPLORER_ANOMALY_RARE_MAX_COUNT
  rare_code_max_share: 0.005 # EXPLORER_ANOMALY_RARE_MAX_SHARE
  rare_code_max_distinct: 50 # EXPLORER_ANOMALY_RARE_MAX_DISTINCT
  rare_code_min_typical_count: 10 # EXPLORER_ANOMALY_RARE_MIN_TYPICAL
  rare_code_min_rows: 50 # EXPLORER_ANOMALY_RARE_MIN_ROWS

profiling:
  top_n_frequent: 10
  # ydata-profiling runs on a random sample of this many rows when a table is larger
  # (0 = always the full table). The planner is told the stats are from a sample; the
  # deterministic engines and every planner check still run on all rows.
  sample_rows: 50000 # EXPLORER_PROFILE_SAMPLE_ROWS
  sample_seed: 42 # fixed, so the same data gives the same profile (and prompt) every run
  max_checks_per_table: 25
  # Repair loop: planner checks that fail to run (sandbox error or pre-flight rejection) are sent back to
  # the planner ONCE per round, all in one call, then re-run. 0 = off. Costs at most one extra LLM call
  # per round and table, and only when a check failed. The loop ends on this counter, never on the model.
  max_repair_rounds: 1 # EXPLORER_MAX_REPAIR_ROUNDS

explain:
  local_llm:
    # "Explain in plain language" on a flagged record (review page). The exact rule-based explanation is always
    # shown; this adds two or three sentences written by the LOCAL model (llm.local.model_path, in-process, no
    # network). It is the only feature where record VALUES reach an LLM, which is why it only ever uses the local
    # model, never a hosted one (the code default is off; it is switched on here). Answers are cached per record.
    # EXPLORER_EXPLAIN_LOCAL_LLM overrides.
    enabled: true
    max_tokens: 220

sandbox:
  timeout_seconds: 10          # per check, from the moment the check starts
  mem_limit_mb: 512            # Unix only: headroom on top of the loaded data
  # Time for the worker to start and receive the tables, once per batch of checks
  # (not counted against timeout_seconds; ~10 s for 1M vendor rows)
  load_timeout_seconds: 120

privacy:
  max_result_list_len: 20

memory:
  vector_backend: chroma
  base_dir: memory_store
  chroma_collection: procedural_skills
  retrieval_top_k: 3
  dedup_distance_threshold: 0.25
  # Client-specific knowledge, one folder per client (company): human decisions
  # that must survive across runs, e.g. duplicate review verdicts.
  clients_dir: memory_store/clients # EXPLORER_CLIENTS_DIR

  # Semantic-memory embeddings: all-MiniLM-L6-v2 as ONNX, run locally on CPU
  # via onnxruntime - free, no API calls, and never contacts Hugging Face.
  # The model files (model.onnx + tokenizer.json) are located in this order:
  embedding:
    # 1. An existing folder containing model.onnx and tokenizer.json (e.g.
    #    copied from another machine). EXPLORER_EMBEDDING_MODEL_DIR
    model_dir: null
    # 2. A Kaggle handle fetched with kagglehub (cached under ~/.cache/kagglehub),
    #    e.g. a private dataset where you uploaded Chroma's onnx/ folder once.
    #    Needs KAGGLE_API_TOKEN for private items.
    #    EXPLORER_EMBEDDING_KAGGLE_HANDLE / EXPLORER_EMBEDDING_KAGGLE_TYPE
    kaggle_handle: null # e.g. "<your-kaggle-user>/all-minilm-l6-v2-onnx"
    kaggle_type: dataset # dataset | model
    # 3. Chroma's cache (~/.cache/chroma/onnx_models/all-MiniLM-L6-v2/onnx).
    #    If missing and allow_download is true, Chroma's official archive is
    #    downloaded from chroma-onnx-models.s3.amazonaws.com (SHA256-verified).
    #    Set false on locked-down servers to fail fast instead of downloading.
    allow_download: true # EXPLORER_EMBEDDING_ALLOW_DOWNLOAD

storage:
  episodic_db_path: episodic_memory.db

logging:
  level: INFO
  dir: logs

cache:
  enable_fast_path: true
  skip_reflection_on_cache_hit: false

review_app:
  cors_origins:
    - "*" # local-only tool; tighten if this ever leaves localhost
